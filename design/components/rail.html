<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>component · rail</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
html,body{margin:0;background:var(--paper);color:var(--ink);font:var(--fs-body)/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
.stage{position:relative;width:420px;height:860px;background:var(--paper)}
</style>
</head>
<body>
<div class="stage">
  <!-- Demo of the rail component. Shape, ring and spacing parameters: see components.css / components.js headers. -->
  <nav class="ag-rail" aria-label="Steps" style="--active:2">
    <ol>
      <li class="done" style="--p:100"><span class="n">1</span><span class="label">Connect</span></li>
      <li class="done" style="--p:100"><span class="n">2</span><span class="label">Scan</span></li>
      <li><span class="n">3</span><span class="label">Results</span></li>
      <li><span class="n">4</span><span class="label">Protect</span></li>
    </ol>
    <div class="ag-ball">3<small>Results</small></div>
  </nav>
</div>
<script>
// ?steps=3 renders a three-step rail (same count as the reference) for the fit check
const steps = Number(new URLSearchParams(location.search).get('steps'));
if (steps === 3) { const ol = document.querySelector('.ag-rail ol'); ol.lastElementChild.remove(); }
</script>
<script src="../components.js"></script>
<script>document.querySelector('.ag-rail').addEventListener('ag:step', (e) => e.currentTarget.activate(e.detail.index));</script>
</body>
</html>
